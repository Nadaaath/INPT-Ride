services:
  postgres:
    image: postgres:16
    container_name: inpt_ride_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - inpt_ride_postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: inpt_ride_redis_prod
    ports:
      - "6380:6379"

  backend:
    image: nadaaath/inpt-ride-backend:latest
    container_name: inpt_ride_backend_prod
    env_file:
      - ../.env.prod
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis

  admin-dashboard:
    image: nadaaath/inpt-ride-admin-dashboard:latest
    container_name: inpt_ride_admin_dashboard_prod
    ports:
      - "8002:80"
    depends_on:
      - backend

volumes:
  inpt_ride_postgres_prod_data: