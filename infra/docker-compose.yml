services:
  postgres:
    image: postgres:16
    container_name: inpt_ride_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inpt_ride_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - inpt_ride_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: inpt_ride_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: inpt_ride_backend
    env_file:
      - ../.env
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ../backend:/app

  admin-dashboard:
    build:
      context: ../admin-dashboard
      dockerfile: Dockerfile
    container_name: inpt_ride_admin_dashboard
    ports:
      - "8002:80"
    depends_on:
      - backend

volumes:
  inpt_ride_postgres_data: