services:
  postgres:
    image: postgres:16
    container_name: inpt_ride_postgres
    environment:
      POSTGRES_DB: inpt_ride_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - inpt_ride_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: inpt_ride_redis
    ports:
      - "6379:6379"

volumes:
  inpt_ride_postgres_data: